<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%">
  <!-- Favicon 13: Half Dog (blue, left) / Half Cat (orange, right) -->
  <ellipse cx="24" cy="26" rx="19" ry="17" fill="#F7F9FB" stroke="#004E89" stroke-width="2.5"/>
  <!-- Left Floppy Dog Ear in Blue -->
  <path d="M10 13 C3 15 2 28 8 35 C12 38 16 33 15 24 C14 18 12 13 10 13 Z" fill="#004E89"/>
  <!-- Left Ear Inner Fold -->
  <path d="M11 18 C7 19.5 6.5 28 10 32.5 C12 34 13.5 31.5 13 26 C12.7 22.5 12 19 11 18 Z" fill="#F7F9FB" opacity="0.35"/>
  <!-- Right Pointy Cat Ear in Orange -->
  <path d="M31.5 16.5 C31 13 33.5 8 38 5.5 C42 8 43 13 41 18 C39 21 33.5 20 31.5 16.5 Z" fill="#FF6B35"/>
  <!-- Right Ear Inner Fold -->
  <path d="M34 15.7 C33.4 13.6 35 10.6 37.7 9 C40.3 10.6 40.7 13.6 39.4 16.6 C37.7 18 34.7 17.4 34 15.7 Z" fill="#F7F9FB" opacity="0.35"/>
  <!-- Eyes: round dog eye (left), almond cat eye (right) -->
  <circle cx="17" cy="20" r="2" fill="#1A202C"/>
  <ellipse cx="31" cy="20" rx="2.4" ry="1.5" fill="#1A202C" transform="rotate(-15 31 20)"/>
  <!-- Button Puppy Nose -->
  <path d="M18 28 C18 26 30 26 30 28 C30 30.5 26 34 24 34 C22 34 18 30.5 18 28 Z" fill="#1A202C"/>
  <!-- Smile -->
  <path d="M24 34 V37 C24 39 20 40 18 38" stroke="#1A202C" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M24 37 C24 39 28 40 30 38" stroke="#1A202C" stroke-width="2" stroke-linecap="round" fill="none"/>
</svg>
