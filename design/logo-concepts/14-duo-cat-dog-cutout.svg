<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <!-- Concept 14: Duo Split Emblem (Solid Half-Blue / Half-Orange Circle with Stylized Ears & Nose) -->
  <g transform="translate(18, 12)">
    <!-- Left Half: Blue with Dog Ear Profile -->
    <path d="M28 4 A24 24 0 0 0 28 52 V36 C28 36 21 37 17 31 C13 25 15 15 22 13 C24 12 28 12 28 4 Z" fill="#004E89"/>
    <!-- Left Dog Ear highlight (soft blue) -->
    <path d="M18 16 C12 18 10 28 16 35 C19 37 23 33 21 24 Z" fill="#FFFFFF" opacity="0.9"/>

    <!-- Right Half: Orange with Cat Pointy Ear Profile -->
    <path d="M28 4 A24 24 0 0 1 28 52 V36 C28 36 35 37 39 31 C43 25 41 15 34 13 C32 12 28 12 28 4 Z" fill="#FF6B35"/>
    <!-- Right Cat Ear highlight (perky triangular notch) -->
    <path d="M34 14 L42 26 L30 29 Z" fill="#FFFFFF" opacity="0.9"/>

    <!-- Central Animal Nose (Connecting Both Halves at Center Base) -->
    <path d="M23.5 35 C23.5 33 32.5 33 32.5 35 C32.5 37 29.5 41 28 41 C26.5 41 23.5 37 23.5 35 Z" fill="#1A202C"/>
    <!-- Center seam line below nose -->
    <path d="M28 41 V47" stroke="#1A202C" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- Wordmark -->
  <text x="88" y="52" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-size="34" font-weight="800" fill="#004E89" letter-spacing="-0.5">Paw<tspan fill="#FF6B35">enn</tspan></text>
</svg>
