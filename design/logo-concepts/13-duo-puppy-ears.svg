<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <!-- Concept 13: Duo Symmetrical Puppy Ears (Duotone Blue/Orange Floppy Ears + Big Button Nose) -->
