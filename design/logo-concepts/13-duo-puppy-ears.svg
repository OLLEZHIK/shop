<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <!-- Concept 13: Half Dog (blue, left) / Half Cat (orange, right) -->
  <g transform="translate(18, 12)">
    <!-- Soft Head Shape -->
    <ellipse cx="28" cy="30" rx="22" ry="20" fill="#F7F9FB" stroke="#004E89" stroke-width="2"/>
    <!-- Left Floppy Dog Ear in Blue -->
    <path d="M12 16 C4 18 3 32 10 40 C14 43 18 38 17 28 C16 22 14 16 12 16 Z" fill="#004E89"/>
    <!-- Left Ear Inner Fold (depth) -->
    <path d="M13 21 C9 22.5 8.5 31 12 35.5 C14 37 15.5 34.5 15 29 C14.7 25.5 14 22 13 21 Z" fill="#F7F9FB" opacity="0.35"/>
    <!-- Right Pointy Cat Ear in Orange -->
    <path d="M37 19 C36 15 39 9 44 6 C49 9 50 15 48 21 C45 24 39 23 37 19 Z" fill="#FF6B35"/>
    <!-- Right Ear Inner Fold (depth) -->
    <path d="M39.5 18 C39 15.5 41 12 44 10 C47 12 47.5 15.5 46 19 C44 20.5 40.5 20 39.5 18 Z" fill="#F7F9FB" opacity="0.35"/>
    <!-- Eyes: round dog eye (left), almond cat eye (right) -->
    <circle cx="20.5" cy="23" r="2.2" fill="#1A202C"/>
    <ellipse cx="35.5" cy="23" rx="2.6" ry="1.6" fill="#1A202C" transform="rotate(-15 35.5 23)"/>
    <!-- Brow: soft dog arc (left), angled cat flick (right) -->
    <path d="M17 19 Q20.5 17 24 19" stroke="#004E89" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M32 19 L35.5 16.5 L39 19" stroke="#FF6B35" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6"/>
    <!-- Cat Whiskers (right cheek only) -->
    <path d="M34 33 L41 31" stroke="#1A202C" stroke-width="1.1" stroke-linecap="round" opacity="0.45"/>
    <path d="M34 35.5 L42 35.5" stroke="#1A202C" stroke-width="1.1" stroke-linecap="round" opacity="0.45"/>
    <path d="M34 38 L41 40" stroke="#1A202C" stroke-width="1.1" stroke-linecap="round" opacity="0.45"/>
    <!-- Shared Nose (Rounded Inverted Triangle) -->
    <path d="M22 32 C22 30 34 30 34 32 C34 34.5 30 38.5 28 38.5 C26 38.5 22 34.5 22 32 Z" fill="#1A202C"/>
    <!-- Nose Highlight -->
    <ellipse cx="25.5" cy="32.3" rx="1.6" ry="1" fill="#F7F9FB" opacity="0.6"/>
    <!-- Little Happy Smile Lines -->
    <path d="M28 38.5 V42 C28 44 24 45 22 43" stroke="#1A202C" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M28 42 C28 44 32 45 34 43" stroke="#1A202C" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>
  <!-- Wordmark -->
  <text x="88" y="52" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-size="34" font-weight="800" fill="#004E89" letter-spacing="-0.5">Paw<tspan fill="#FF6B35">enn</tspan></text>
</svg>
