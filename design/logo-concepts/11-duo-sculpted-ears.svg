<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <!-- Concept 11: Duo Sculpted Ears (Large Protruding Dog & Cat Ears + Centered Nose) -->
  <g transform="translate(18, 12)">
    <!-- Head Badge -->
    <circle cx="28" cy="30" r="23" fill="#F7F9FB" stroke="#004E89" stroke-width="2.5"/>
    <!-- Left Ear: Folded Dog Ear in Brand Blue -->
    <path d="M15 17 C7 18 6 33 13 42 C16 44 21 38 19 28 C18 22 17 17 15 17 Z" fill="#004E89"/>
    <!-- Right Ear: Perky Cat Ear Cresting Top-Right in Brand Orange -->
    <path d="M31 16 L44 8 L44 26 C43 29 36 28 31 22 Z" fill="#FF6B35"/>
    <!-- Centered Inverted Rounded Triangle Nose -->
    <path d="M23.5 34 C23.5 32.5 32.5 32.5 32.5 34 C32.5 35.8 29.5 39.5 28 39.5 C26.5 39.5 23.5 35.8 23.5 34 Z" fill="#1A202C"/>
    <!-- Philtrum line below nose -->
    <path d="M28 39.5 V42.5" stroke="#1A202C" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <!-- Wordmark -->
  <text x="88" y="52" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-size="34" font-weight="800" fill="#004E89" letter-spacing="-0.5">Paw<tspan fill="#FF6B35">enn</tspan></text>
</svg>
