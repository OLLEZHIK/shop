<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <!-- Concept 15: Duo Muzzle Smile (Nose + Muzzle Cheeks + Asymmetric Dog/Cat Ears) -->
  <g transform="translate(18, 12)">
    <!-- Soft Head Circle -->
    <circle cx="28" cy="28" r="25" fill="#F7F9FB" stroke="#004E89" stroke-width="2"/>
    <!-- Left Dog Floppy Ear in Blue -->
    <path d="M16 14 C9 15 8 28 14 36 C17 38 21 34 20 25 C19 19 17 14 16 14 Z" fill="#004E89"/>
    <!-- Right Cat Perky Ear in Orange -->
    <path d="M32 14 L44 8 L40 25 C39 28 35 27 32 20 Z" fill="#FF6B35"/>
    <!-- Animal Nose (Inverted Rounded Triangle) -->
    <path d="M23 30 C23 28 33 28 33 30 C33 32.5 29.5 36 28 36 C26.5 36 23 32.5 23 30 Z" fill="#1A202C"/>
    <!-- Muzzle Smile Arches (Left & Right Whiskers/Cheeks) -->
    <path d="M28 36 V39 C28 42 23 43 20 41" stroke="#004E89" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M28 39 C28 42 33 43 36 41" stroke="#004E89" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>
  <!-- Wordmark -->
  <text x="88" y="52" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-size="34" font-weight="800" fill="#004E89" letter-spacing="-0.5">Paw<tspan fill="#FF6B35">enn</tspan></text>
</svg>
