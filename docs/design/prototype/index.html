<title>Pawenn prototyp</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<style>
:root{
  --orange:#FF6B35; --orange-tint:#FFE8DC; --orange-soft:#FFF4EE; --orange-line:#F4C7B2;
  --navy:#0B2545; --blue:#004E89; --blue-tint:#E7F0F8;
  --text:#1C2433; --muted:#5B6472; --line:#E7E3DE; --bg:#FFFFFF; --bg2:#F6F4F1;
  --open:#15803D; --open-tint:#E4F3E9; --closed:#5B6472; --closed-tint:#EFEDEA;
  --mixed:#8A5300; --mixed-tint:#FBEFD9; --star:#E8590C;
  --r:12px;
  font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
h1,h2,h3{color:var(--navy);text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:600px;margin:0 auto;padding-inline:16px}
.muted{color:var(--muted)}
.small{font-size:14px}
.tiny{font-size:12.5px}
.link{color:var(--blue);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.icon{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.hdr.on-hero{background:var(--orange);border-bottom-color:transparent}
.hdr-in{height:60px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{display:flex;align-items:center;margin-left:-12px}
.logo svg{width:138px;height:34px}
.hdr-actions{display:flex;gap:6px;align-items:center}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border:0;background:transparent;border-radius:10px;color:var(--navy)}
.menu-btn{height:40px;padding:0 14px;display:flex;align-items:center;gap:6px;border:1.5px solid var(--navy);border-radius:10px;background:transparent;color:var(--navy);font-weight:700}

/* hero */
.hero{background:var(--orange);color:var(--navy);padding-block:14px 30px}
.hero h1{font-size:clamp(32px,8.6vw,44px);line-height:1.05;letter-spacing:-0.03em}
.hero p{margin:12px 0 0;font-size:17px;max-width:32ch}
.search-card{margin-top:20px;padding:6px;border-radius:14px;background:#fff;box-shadow:0 3px 0 var(--navy)}
.field{display:flex;align-items:center;gap:10px;min-height:54px;padding:0 12px;border-bottom:1px solid var(--line)}
.field:last-of-type{border-bottom:0}
.field label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:block}
.field select{width:100%;border:0;background:transparent;font:500 16px 'DM Sans',system-ui,sans-serif;color:var(--text);padding:2px 0 6px;appearance:none;-webkit-appearance:none}
.field .fwrap{flex:1;min-width:0;padding-top:6px}
.btn-dark{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;width:100%;border:0;border-radius:10px;background:var(--navy);color:#fff;font-weight:700;font-size:16px}

/* sections */
.sec{padding-block:28px 0}
.sec h2{font-size:22px;letter-spacing:-0.02em}
.sec .sub{margin:4px 0 0;font-size:14.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:0 14px;border:1.5px solid var(--navy);border-radius:10px;background:#fff;color:var(--navy);font-weight:700;font-size:15px}
.chip .count{font-weight:500;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--open);flex:none}
.row-link{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.row-link .ic{width:44px;height:44px;border-radius:50%;background:var(--orange-tint);display:grid;place-items:center;color:var(--navy);flex:none}
.row-link .ic .icon{width:22px;height:22px}
.row-link .tx{flex:1;min-width:0}
.row-link b{display:block;font-size:17px;color:var(--navy)}
.panel{margin-top:14px;padding:18px 16px;border-radius:16px;background:var(--orange-soft);border:1px solid var(--orange-tint)}
.prow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 0;border-top:1px solid var(--orange-line)}
.prow:first-of-type{border-top:0}
.prow b{font-size:18px;color:var(--navy)}
.bar{position:relative;height:6px;border-radius:3px;background:#EDE3DB;margin-top:8px}
.bar .mk{position:absolute;top:-4px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 2px #fff}
.bar .md{position:absolute;top:-4px;width:2px;height:14px;margin-left:-1px;background:var(--navy);opacity:.55}
.dist-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.dchip{border:1px solid #CFC8C0;background:#fff;border-radius:999px;padding:6px 12px;font-size:14.5px;font-weight:500}
.dchip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.dchip .count{opacity:.7;margin-left:4px}
.dpanel{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:4px 14px}
.trust{display:flex;gap:10px;align-items:flex-start;margin-top:26px;font-size:14px;color:var(--muted)}

/* footer */
.foot{margin-top:40px;background:var(--navy);color:#DCE4EE;padding-block:26px 30px}
.foot a{color:#fff}
.foot-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px;font-size:15px}
.foot p{margin:16px 0 0;font-size:13px;color:#AFC0D4}

/* list page */
.crumbs{font-size:14px;color:var(--muted);padding-top:14px}
.crumbs a{text-decoration:underline;text-underline-offset:3px}
.page-h1{font-size:28px;line-height:1.1;letter-spacing:-0.02em;margin-top:10px}
.lead{margin:8px 0 0;font-size:16px;color:var(--text)}
.searchbar{display:flex;align-items:center;gap:10px;min-height:46px;padding:0 12px;margin-top:14px;border:1.5px solid var(--navy);border-radius:10px;background:#fff;width:100%;text-align:left;font-size:15px}
.filters{display:flex;gap:8px;overflow-x:auto;margin:14px -16px 0;padding:0 16px 14px;border-bottom:1px solid var(--line);scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;min-height:40px;padding:0 13px;display:inline-flex;align-items:center;gap:6px;border:1px solid #C9C4BE;border-radius:10px;background:#fff;font-weight:500;font-size:14.5px;white-space:nowrap}
.fchip.strong{border:1.5px solid var(--navy);font-weight:700}
.fchip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
.fchip .badge{min-width:20px;height:20px;border-radius:10px;background:var(--orange);color:var(--navy);font-size:12px;display:grid;place-items:center;padding:0 5px}
.sortline{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:12px;font-size:14px;color:var(--muted)}
.card{padding:18px 0;border-bottom:1px solid var(--line)}
.card-top{display:flex;gap:14px}
.av{flex:none;width:64px;height:64px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;overflow:hidden;font-weight:700;font-size:22px;color:var(--navy)}
.av img{width:76%;height:76%;object-fit:contain}
.av.ini{background:var(--orange-tint);border-color:var(--orange-tint)}
.av.lg{width:84px;height:84px;font-size:28px}
.card-name{display:block;font-size:18px;font-weight:700;line-height:1.2;color:var(--navy)}
.card-name:hover{text-decoration:underline}
.meta{margin-top:3px;font-size:14.5px;color:var(--muted)}
.rating{display:flex;align-items:center;gap:4px;margin-top:4px;font-size:14.5px}
.rating b{color:var(--navy)}
.tier{font-weight:700;color:var(--navy);letter-spacing:.5px}
.tier i{font-style:normal;opacity:.25}
.status{margin-top:12px;font-size:14px;font-weight:700}
.status.open{color:var(--open)} .status.closed,.status.appt,.status.unknown{color:var(--closed)}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}
.slot{padding:7px 4px;border-radius:8px;background:var(--orange-soft);text-align:center;min-width:0}
.slot span{display:block;font-size:12.5px;color:var(--muted)}
.slot b{display:block;font-size:13.5px;color:var(--navy);overflow-wrap:anywhere}
.slot.today{background:var(--orange)} .slot.today span{color:var(--navy);font-weight:700}
.slot.off{background:var(--bg2)} .slot.off b{color:var(--muted);font-weight:500}
.slot.wide{grid-column:1/-1}
.btn-call{margin-top:12px;height:48px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;background:var(--orange);color:var(--navy);font-weight:700;font-size:16.5px}
.btn-call:hover{filter:brightness(.97)}
.btn-line{height:46px;display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--navy);border-radius:10px;background:#fff;color:var(--navy);font-weight:700;font-size:15.5px;padding:0 12px;min-width:0}
.btn-line span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.price-card{margin-top:18px;padding:18px 16px;border-radius:16px;background:var(--orange-soft);border:1px solid var(--orange-tint)}
.price-card .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.ptile{display:block;padding:10px 12px;border-radius:10px;background:#fff}
.ptile span{display:block;font-size:13.5px;color:var(--muted)}
.ptile b{font-size:20px;color:var(--navy)}
.empty{padding:28px 0;text-align:center}
.note-card{margin-top:22px;padding:16px;border-radius:12px;background:var(--bg2)}

/* detail */
.back{display:inline-flex;align-items:center;gap:4px;margin-top:12px;font-weight:700;color:var(--blue);min-height:36px}
.dhead{display:flex;gap:16px;align-items:center;margin-top:12px}
.dhead h1{font-size:27px;line-height:1.08;letter-spacing:-0.02em}
.dsec{margin-top:28px;padding-top:24px;border-top:8px solid var(--bg2)}
.dsec h2{font-size:22px;letter-spacing:-0.02em}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:14px;text-align:center}
.wday{padding:8px 0;border-radius:8px;background:var(--bg2)}
.wday span{display:block;font-size:12.5px;color:var(--muted)}
.wday{min-width:0}
.wday b{display:block;font-size:12.5px;color:var(--navy);line-height:1.3;overflow-wrap:anywhere}
.wday.today{background:var(--orange)} .wday.today span{color:var(--navy);font-weight:700}
.wday.off b{color:var(--muted);font-weight:500}
.drow{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.drow .l{min-width:0}
.drow .l b{display:block;font-size:16px;color:var(--navy)}
.drow .r{font-size:17px;font-weight:700;color:var(--navy);white-space:nowrap}
.tag{display:inline-block;padding:4px 11px;border-radius:8px;background:var(--bg2);font-size:14px;margin:0 6px 6px 0}
.sent{font-weight:700}
.sent.positive{color:var(--open)} .sent.mixed{color:var(--mixed)} .sent.negative{color:#B42318}
details.faq{border-bottom:1px solid var(--line)}
details.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:12px;padding:12px 0;font-weight:700;color:var(--navy)}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary::after{content:"+";font-size:20px;line-height:1;color:var(--muted)}
details.faq[open] summary::after{content:"–"}
details.faq p{margin:0 0 12px;color:var(--text)}
.kv{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:15.5px}
.kv .icon{margin-top:2px;color:var(--muted)}
.kv .copy{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 10px;font-size:13px;font-weight:700;color:var(--blue)}
.srcline{margin-top:18px;font-size:13.5px;color:var(--muted)}

/* table */
.tbl{width:100%;border-collapse:collapse;margin-top:12px;font-size:15px}
.tbl th{text-align:left;font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px 6px 8px 0;border-bottom:1px solid var(--line)}
.tbl td{padding:12px 6px 12px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.n,.tbl th.n{text-align:right;padding-right:0;white-space:nowrap}
.tbl a{color:var(--navy);font-weight:700}
.tbl a:hover{text-decoration:underline}

/* sheets & toast */
.scrim{position:fixed;inset:0;background:rgba(11,37,69,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:600px;max-height:88%;overflow:auto;background:#fff;border-radius:18px 18px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0 10px}
.sheet-h h2{font-size:21px}
.grab{width:40px;height:4px;border-radius:2px;background:#D8D2CB;margin:0 auto 6px}
.opt-row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 18px}
.sheet label.lbl{display:block;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:6px}
.sel{width:100%;height:48px;border:1px solid #C9C4BE;border-radius:10px;padding:0 12px;font:16px 'DM Sans',system-ui,sans-serif;background:#fff;color:var(--text);margin:8px 0 18px}
.sinput{width:100%;height:52px;border:1.5px solid var(--navy);border-radius:10px;padding:0 14px 0 44px;font:16px 'DM Sans',system-ui,sans-serif;color:var(--text)}
.sres{margin-top:10px}
.sres h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 2px}
.sres a{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;width:min(560px,calc(100% - 32px));background:var(--navy);color:#fff;border-radius:12px;padding:14px 16px;box-shadow:0 10px 30px rgba(11,37,69,.3);font-size:15px}
.toast b{display:block;font-size:18px;margin-top:2px;user-select:all}
.toast .row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.toast button{border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;border-radius:8px;padding:6px 10px;font-weight:700}
.proto-note{background:var(--bg2);font-size:13px;color:var(--muted);text-align:center;padding:6px 16px}
@media (min-width:720px){.wrap{max-width:720px}.slots{grid-template-columns:repeat(3,minmax(0,160px))}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<div class="proto-note">Prototyp dizajnu pawenn · údaje z databázy k 25. 9. 2026 · čas podľa Bratislavy</div>
<div id="app" aria-live="polite"><div class="wrap" style="padding-block:40px"><p class="muted">Načítavam…</p></div></div>
<div id="layer"></div>

<script>
(() => {
const TZ = 'Europe/Bratislava';
const DAYS = ['mo','tu','we','th','fr','sa','su'];
const D_SHORT = {mo:'Po',tu:'Ut',we:'St',th:'Št',fr:'Pi',sa:'So',su:'Ne'};
const D_LONG = {mo:'Pondelok',tu:'Utorok',we:'Streda',th:'Štvrtok',fr:'Piatok',sa:'Sobota',su:'Nedeľa'};
const D_IN = {mo:'v pondelok',tu:'v utorok',we:'v stredu',th:'vo štvrtok',fr:'v piatok',sa:'v sobotu',su:'v nedeľu'};
const ATTRS = [
  {key:'nonstop', slug:'nonstop', chip:'Nonstop', h1:'Veterinár nonstop v Bratislave',
   lead:(n,t)=>`${n} z ${t} veterinárnych ambulancií prijíma pacientov 24 hodín denne, 7 dní v týždni. Pred cestou zavolajte.`},
  {key:'saturday', slug:'sobota', chip:'V sobotu', h1:'Veterinár otvorený v sobotu v Bratislave',
   lead:(n,t)=>`V sobotu má otvorené ${n} z ${t} veterinárnych ambulancií. Otváracie hodiny nižšie, overené pri každej ambulancii.`},
  {key:'sunday', slug:'nedela', chip:'V nedeľu', h1:'Veterinár otvorený v nedeľu v Bratislave',
   lead:(n,t)=>`V nedeľu má otvorené ${n} z ${t} veterinárnych ambulancií. Otváracie hodiny nižšie, overené pri každej ambulancii.`},
  {key:'exotics', slug:'exoticke-zvierata', chip:'Exotické zvieratá', h1:'Veterinár pre exotické zvieratá v Bratislave',
   lead:(n,t)=>`Exotické zvieratá – plazy, vtáky, hlodavce – ošetruje ${n} z ${t} veterinárnych ambulancií. Pred návštevou si overte váš druh.`},
  {key:'home', slug:'vyjazd-domov', chip:'Výjazd domov', h1:'Veterinár s výjazdom domov v Bratislave',
   lead:(n,t)=>`Výjazd k vám domov ponúka ${n} z ${t} veterinárnych ambulancií.`},
];

let D = null, byCat = {}, bySlug = {}, dByslug = {}, pricesBy = {};
const ui = { open:false, animal:'all', rating:0, sort:'rec', listKey:'', distOpen:'' };

/* ---------- helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const plural = (n, one, few, many) => n === 1 ? one : (n >= 2 && n <= 4 ? few : many);
const eurN = v => (Math.round(v*100)/100).toLocaleString('sk-SK', {minimumFractionDigits: v % 1 ? 2 : 0, maximumFractionDigits: 2});
const eur = v => eurN(v) + '\u00a0€';
const fdate = iso => { if (!iso) return ''; const [y,m,d] = iso.split('-').map(Number); return `${d}. ${m}. ${y}`; };
const street = a => (a || '').split(',')[0];
const catOf = k => D.cats.find(c => c.k === k);
const catBySlug = s => D.cats.find(c => c.slug === s);
const I = {
  search:'<svg class="icon" viewBox="0 0 20 20"><circle cx="8.8" cy="8.8" r="5.3"/><path d="m12.8 12.8 4 4"/></svg>',
  menu:'<svg class="icon" viewBox="0 0 20 20"><path d="M3.5 6h13M3.5 10h13M3.5 14h13"/></svg>',
  phone:'<svg class="icon" viewBox="0 0 20 20"><path d="M5.5 2.8h2.2l1.2 3.4-1.7 1.1a9.5 9.5 0 0 0 5.5 5.5l1.1-1.7 3.4 1.2v2.2a1.8 1.8 0 0 1-1.9 1.8A13.6 13.6 0 0 1 3.7 4.7a1.8 1.8 0 0 1 1.8-1.9Z"/></svg>',
  route:'<svg class="icon" viewBox="0 0 20 20"><path d="m3 9.3 13.6-6.1-6.1 13.6-1.6-5.9L3 9.3Z"/></svg>',
  globe:'<svg class="icon" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.2"/><path d="M2.8 10h14.4M10 2.8c2 2.1 2.9 4.5 2.9 7.2s-.9 5.1-2.9 7.2c-2-2.1-2.9-4.5-2.9-7.2s.9-5.1 2.9-7.2Z"/></svg>',
  pin:'<svg class="icon" viewBox="0 0 20 20"><path d="M10 17.5s5.5-5.1 5.5-9A5.5 5.5 0 1 0 4.5 8.5c0 3.9 5.5 9 5.5 9Z"/><circle cx="10" cy="8.5" r="2"/></svg>',
  mail:'<svg class="icon" viewBox="0 0 20 20"><rect x="2.8" y="4.5" width="14.4" height="11" rx="1.8"/><path d="m3.5 5.5 6.5 5 6.5-5"/></svg>',
  chev:'<svg class="icon" viewBox="0 0 20 20" style="width:18px;height:18px"><path d="m8 5 5 5-5 5"/></svg>',
  back:'<svg class="icon" viewBox="0 0 20 20" style="width:18px;height:18px"><path d="m12 5-5 5 5 5"/></svg>',

/* ---------- opening hours (same rules as website/lib/hours.ts) ---------- */
function mins(s){ const m = /^(\d{1,2}):(\d{2})$/.exec(s.trim()); return m ? (+m[1])*60 + (+m[2]) : null; }
function parseDay(spec){
  const s = spec.trim();
  if (s === '24h' || s === 'closed' || s === 'by-appointment') return {kind: s};
  const iv = s.split(',').map(p => p.trim().split('-').map(mins)).filter(([a,b]) => a !== null && b !== null && a < b);
  return iv.length ? {kind:'iv', iv} : null;
}
const hoursCache = new Map();
function hoursOf(b){
  if (hoursCache.has(b.id)) return hoursCache.get(b.id);
  let h = null; const raw = (b.h || '').trim();
  if (raw === '24h' || raw === 'closed' || raw === 'by-appointment') { h = {}; DAYS.forEach(d => h[d] = {kind: raw}); }
  else if (raw) { h = {}; raw.split(';').forEach(c => { const t = c.trim(); if (!t) return; const [day, ...rest] = t.split(/\s+/); const p = parseDay(rest.join(' ')); if (p && DAYS.includes(day)) h[day] = p; }); if (!Object.keys(h).length) h = null; }
  hoursCache.set(b.id, h); return h;
}
function nowLocal(){
  const parts = new Intl.DateTimeFormat('en-GB', {timeZone: TZ, weekday:'short', hour:'2-digit', minute:'2-digit', hourCycle:'h23'}).formatToParts(new Date());
  const g = t => parts.find(p => p.type === t)?.value ?? '';
  return { day: g('weekday').slice(0,2).toLowerCase(), minute: (+g('hour'))*60 + (+g('minute')) };
}
const hm = m => m >= 1440 ? '24:00' : `${Math.floor(m/60)}:${String(m%60).padStart(2,'0')}`;
function dayText(d){
  if (!d) return {t:'neuvedené', off:true};
  if (d.kind === '24h') return {t:'nonstop'};
  if (d.kind === 'closed') return {t:'zatvorené', off:true};
  if (d.kind === 'by-appointment') return {t:'na objednávku', off:true};
  return {t: d.iv.map(([a,b]) => `${hm(a)}–${hm(b)}`).join(', ')};
}
function isNonstop(b){ const h = hoursOf(b); return !!b.e && !!h && DAYS.every(d => h[d]?.kind === '24h'); }
function statusOf(b){
  const h = hoursOf(b);
  if (isNonstop(b)) return {k:'open', t:'Nonstop · otvorené 24 hodín, 7 dní v týždni', short:'Nonstop'};
  if (!h) return {k:'unknown', t:'Otváracie hodiny neuvedené'};
  const {day, minute} = nowLocal(); const today = h[day];
  if (today?.kind === '24h') return {k:'open', t:'Otvorené celý deň'};
  if (today?.kind === 'iv') { const cur = today.iv.find(([a,b]) => minute >= a && minute < b); if (cur) return {k:'open', t: cur[1] >= 1440 ? 'Otvorené do polnoci' : `Otvorené do ${hm(cur[1])}`}; }
  if (DAYS.every(d => !h[d] || h[d].kind === 'by-appointment')) return {k:'appt', t:'Na objednávku – zavolajte vopred'};
  if (today?.kind === 'by-appointment') return {k:'appt', t:'Dnes na objednávku'};
  // next opening
  if (today?.kind === 'iv') { const nx = today.iv.find(([a]) => a > minute); if (nx) return {k:'closed', t:`Zatvorené · otvára dnes o ${hm(nx[0])}`}; }
  const idx = DAYS.indexOf(day);
  for (let i = 1; i <= 7; i++) {
    const d = DAYS[(idx + i) % 7], dh = h[d];
    if (dh?.kind === 'iv' || dh?.kind === '24h') { const at = dh.kind === '24h' ? 0 : dh.iv[0][0]; return {k:'closed', t:`Zatvorené · otvára ${i === 1 ? 'zajtra' : D_IN[d]} o ${hm(at)}`}; }
  }
  return {k:'closed', t:'Zatvorené'};
}
const isOpenNow = b => statusOf(b).k === 'open';
function hasAttr(b, key){
  const h = hoursOf(b), openDay = d => !!h && (h[d]?.kind === 'iv' || h[d]?.kind === '24h');
  if (key === 'nonstop') return !!b.e;
  if (key === 'saturday') return !!b.e || openDay('sa');
  if (key === 'sunday') return !!b.e || openDay('su');
  if (key === 'exotics') return !!b.ex;
  if (key === 'home') return !!b.hv;
  return false;
}

/* ---------- daily order (same as website/lib/data.ts) ---------- */
function seededHash(id, seed){ let h = (Math.imul(id, 2654435761) + Math.imul(seed, 40503)) >>> 0; h ^= h >>> 16; h = Math.imul(h, 2246822507); h ^= h >>> 13; h = Math.imul(h, 3266489909); h ^= h >>> 16; return h >>> 0; }
function rotate(items){ const d = new Date(); const seed = d.getUTCFullYear()*10000 + d.getUTCMonth()*100 + d.getUTCDate(); return [...items].sort((a,b) => seededHash(a.id, seed) - seededHash(b.id, seed)); }

const tierHtml = t => `<span class="tier" aria-label="${t} z 5">${'€'.repeat(t)}<i>${'€'.repeat(5-t)}</i></span>`;
const levelText = (t, pct) => t === 3 ? 'trhová cena' : (pct < 0 ? `o ${-pct} % pod trhom` : `o ${pct} % nad trhom`);
const svcOf = (cat, code) => (D.services[cat] || []).find(s => s.code === code);
const marketOf = (cat, code) => D.market[`${cat}:${code}`];
function priceText(p){
  let s = p.t && p.t > p.f ? `${eurN(p.f)}–${eur(p.t)}` : (p.t === p.f ? eur(p.f) : `od ${eur(p.f)}`);
  if (p.u === 'per_hour') s += ' / hod'; if (p.u === 'per_km') s += ' / km';
  return s;
}
function weightText(p){ if (p.wf == null && p.wt == null) return ''; if (p.wf == null) return `do ${p.wt} kg`; if (p.wt == null) return `nad ${p.wf} kg`; return `${p.wf}–${p.wt} kg`; }
function placePrice(bid, code){ const c = (pricesBy[bid] || []).filter(p => p.c === code && p.cmp); return c.length ? Math.min(...c.map(p => p.f)) : null; }
const pctAgainst = (v, m) => Math.round((v / m - 1) * 100);
const marketLabel = pct => Math.abs(pct) <= 7.5 ? 'trhová cena' : (pct < 0 ? `o ${-pct} % pod trhom` : `o ${pct} % nad trhom`);

function pageBiz(slug){

  const prices = pricesBy[b.id] || [];

  const sorted = [...prices].sort((p, q) => svcOrder.indexOf(p.c) - svcOrder.indexOf(q.c) || (p.wf ?? -1) - (q.wf ?? -1));
  const shown = new Set();
  const priceRows = sorted.map(p => {
    const s = svcOf(b.c, p.c), m = marketOf(b.c, p.c), w = weightText(p);
    let cmp = '';
    if (p.cmp && m && !shown.has(p.c) && p.f === placePrice(b.id, p.c)) { shown.add(p.c); const pct = pctAgainst(p.f, m.median); cmp = `${marketLabel(pct)} · medián v meste ${eur(m.median)}`; }
    const extra = [w, p.pa ? 'len časť služby' : '', p.n || '', s?.inc && !w ? s.inc : ''].filter(Boolean).join(' · ');
    return `<div class="drow"><div class="l"><b>${esc(s ? s.label : p.c)}</b>${extra ? `<span class="small muted">${esc(extra)}</span><br>` : ''}${cmp ? `<span class="small" style="color:${cmp.startsWith('o ') && cmp.includes('pod') ? 'var(--open)' : 'var(--muted)'}">${esc(cmp)}</span>` : ''}</div><div class="r num">${priceText(p)}</div></div>`;

  const obs = prices.length ? fdate(prices.map(p => p.o).sort().pop()) : '';
  const similar = rotate(byCat[b.c].filter(x => x.id !== b.id && x.d && x.d === b.d)).concat(rotate(byCat[b.c].filter(x => x.id !== b.id && x.d !== b.d))).slice(0, 3);

    ${ratingHtml(b)}
    <div class="meta">${esc(b.a)}${b.t ? ` · ${tierHtml(b.t)} ${levelText(b.t, b.pct)}` : ''}</div>
    <div class="status ${st.k}" style="margin-top:6px">${esc(st.t)}</div>
    ${b.ph ? `<button class="btn-call" data-call="${b.id}" style="height:54px;font-size:17px;margin-top:16px">${I.phone}Zavolať ${esc(b.ph)}</button>` : ''}
    <div class="two"><a class="btn-line" href="${esc(mapsUrl)}" target="_blank" rel="noopener">${I.route}<span>Trasa</span></a>${b.w ? `<a class="btn-line" href="${esc(b.w)}" target="_blank" rel="noopener">${I.globe}<span>${esc(b.wh)}</span></a>` : (b.em ? `<a class="btn-line" href="mailto:${esc(b.em)}">${I.mail}<span>E-mail</span></a>` : '')}</div>

    ${h ? `<section class="dsec"><h2>Otváracie hodiny</h2>
      ${isNonstop(b) ? `<p style="margin:10px 0 0;font-weight:700;color:var(--open)">Nonstop – 24 hodín, 7 dní v týždni</p>` :
      DAYS.every(d => !h[d] || h[d].kind === 'by-appointment') ? `<p style="margin:10px 0 0">Na objednávku – termín si dohodnite telefonicky.</p>` :
      `<div class="week">${DAYS.map(d => { const t = dayText(h[d]); const parts = t.off ? [t.t] : t.t.split(', ').flatMap(x => x === 'nonstop' ? ['0:00','24:00'] : x.split('–')); return `<div class="wday ${d===day?'today':''} ${t.off?'off':''}"><span>${d===day?'Dnes':D_SHORT[d]}</span>${parts.map(x => `<b>${esc(x)}</b>`).join('')}</div>`; }).join('')}</div>`}
      ${b.ho ? `<p class="tiny muted" style="margin:10px 0 0">Overené ${fdate(b.ho)}${b.hs ? ` · zdroj: ${esc(b.hs)}` : ''}</p>` : ''}</section>` : ''}

    ${priceRows.length ? `<section class="dsec"><h2>Ceny</h2><p class="small muted" style="margin:4px 0 4px">Z cenníka podniku${obs ? ', overené ' + obs : ''}. Medián = stredná cena v Bratislave.</p>${priceRows.join('')}
      <p style="margin:12px 0 0"><a class="link" href="#p~${c.slug}">Ceny ${esc(c.many)} v Bratislave</a></p></section>` : ''}

function pagePrice(catSlug, svcSlug){
  const c = catBySlug(catSlug); if (!c) return page404();
  const s = (D.services[c.k] || []).find(x => x.slug === svcSlug); if (!s) return page404();
  const m = marketOf(c.k, s.code);
  const all = D.prices.filter(p => p.c === s.code && byId[p.b]?.c === c.k);
  const comparable = [...new Set(all.filter(p => p.cmp).map(p => p.b))].map(bid => ({b: byId[bid], v: placePrice(bid, s.code)})).sort((a, b) => a.v - b.v);
  const other = all.filter(p => !p.cmp);
  const latest = all.length ? fdate(all.map(p => p.o).sort().pop()) : '';
  const pos = v => m && m.max > m.min ? (v - m.min) / (m.max - m.min) * 100 : 50;
  return header() + `<main class="wrap">
    <nav class="crumbs"><a href="#">Bratislava</a> › <a href="#c~${c.slug}">${esc(c.label)}</a> › <a href="#p~${c.slug}">Ceny</a> › ${esc(s.label)}</nav>
    <h1 class="page-h1">${esc(s.label)} v Bratislave – ceny</h1>
    ${m ? `<p class="lead">Stojí od ${eur(m.min)} do ${eur(m.max)}, medián ${eur(m.median)}. Porovnali sme ${m.places} ${plural(m.places,'podnik','podniky','podnikov')}, ceny overené ${latest}.</p>` : `<p class="lead">Túto cenu zatiaľ zverejnilo len ${comparable.length} ${plural(comparable.length,'podnik','podniky','podnikov')} – na porovnanie je to málo.</p>`}
    ${s.inc ? `<p class="small" style="margin:10px 0 0"><b style="color:var(--navy)">Čo zahŕňa cena:</b> ${esc(s.inc)}</p>` : ''}
    ${m ? `<div class="panel" style="margin-top:16px"><div class="bar" style="margin-top:4px">${comparable.map(r => `<span class="mk" style="left:${pos(r.v)}%;background:#fff;box-shadow:0 0 0 2px var(--orange);width:10px;height:10px;top:-2px;margin-left:-5px"></span>`).join('')}<span class="md" style="left:${pos(m.median)}%"></span></div>
      <div class="tiny muted num" style="display:flex;justify-content:space-between;margin-top:8px"><span>${eur(m.min)}</span><span>medián ${eur(m.median)}</span><span>${eur(m.max)}</span></div><p class="tiny muted" style="margin:6px 0 0">Každý krúžok je jeden podnik, čiarka je medián.</p></div>` : ''}
    <div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Podnik</th><th class="n">Cena</th></tr></thead><tbody>
      ${comparable.map(r => { const pct = m ? pctAgainst(r.v, m.median) : null; const dist = D.districts.find(x => x.slug === r.b.d);
        return `<tr><td><a href="#b~${r.b.s}">${esc(r.b.n)}</a><br><span class="tiny muted">${dist ? esc(dist.name) : ''}${pct !== null ? ` · <span style="color:${pct < -7.5 ? 'var(--open)' : 'inherit'}">${marketLabel(pct)}</span>` : ''}</span><br><button class="link" data-call="${r.b.id}" style="background:none;border:0;padding:0;margin-top:4px">Zavolať</button></td><td class="n num"><b style="color:var(--navy)">${(pricesBy[r.b.id]||[]).some(p => p.c === s.code && p.cmp && p.f === r.v && p.t == null) ? 'od ' : ''}${eur(r.v)}</b></td></tr>`; }).join('')}
    </tbody></table></div>
    ${other.length ? `<section class="note-card"><b style="color:var(--navy)">Ďalšie ceny (neporovnávame)</b><p class="small muted" style="margin:4px 0 6px">Čiastočné ceny, ceny za hodinu či kilometer alebo ceny, ktoré zahŕňajú viac ako štandard.</p>
      ${other.map(p => `<div class="drow"><div class="l"><a href="#b~${byId[p.b].s}" style="display:block;font-weight:700;color:var(--navy)">${esc(byId[p.b].n)}</a><span class="small muted">${esc([weightText(p), p.pa ? 'len časť služby' : '', p.n || ''].filter(Boolean).join(' · '))}</span></div><div class="r num">${priceText(p)}</div></div>`).join('')}</section>` : ''}
    <section class="sec"><h2 style="font-size:19px">Ďalšie ceny</h2><div class="chips">${(D.services[c.k]||[]).filter(x => x.slug !== s.slug && D.prices.some(p => p.c === x.code && byId[p.b]?.c === c.k)).map(x => `<a class="chip" style="border-width:1px;font-weight:500" href="#p~${c.slug}~${x.slug}">${esc(x.label)}</a>`).join('')}</div></section>
    <p style="margin-top:18px"><a class="link" href="#c~${c.slug}">Všetky ${esc(c.many)} v Bratislave</a></p>
  </main>` + footer();
}

/* ---------- sheets ---------- */
const layer = document.getElementById('layer');
let lastFocus = null;
function openSheet(title, body, onMount){
  lastFocus = document.activeElement;
  layer.innerHTML = `<div class="scrim" data-close><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="grab"></div><div class="sheet-h"><h2>${esc(title)}</h2><button class="icon-btn" data-close aria-label="Zavrieť">${I.close}</button></div>${body}</div></div>`;
  const sheet = layer.querySelector('.sheet');
  sheet.addEventListener('click', e => e.stopPropagation());
  layer.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', e => { if (e.target === el || el.tagName === 'BUTTON') closeSheet(); }));
  onMount && onMount(sheet);
  (sheet.querySelector('input,select,button:not([data-close])') || sheet).focus();
}
function closeSheet(){ layer.innerHTML = ''; lastFocus && lastFocus.focus && lastFocus.focus(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && layer.innerHTML) closeSheet(); });

function openSearch(){
  openSheet('Hľadať', `<div style="position:relative"><span style="position:absolute;left:14px;top:16px;color:var(--muted)">${I.search}</span><label for="sq" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)">Hľadať</label><input id="sq" class="sinput" type="search" autocomplete="off" placeholder="Veterinár, Ružinov, kastrácia, názov…"></div><div class="sres" id="sres"></div>`, sheet => {
    const inp = sheet.querySelector('#sq'), out = sheet.querySelector('#sres');
    const run = () => {
      const q = norm(inp.value.trim());
      if (!q) { out.innerHTML = `<h3>Časté hľadania</h3>${[['#c~veterinar~teraz','Veterinár otvorený teraz'],['#c~veterinar~nonstop','Veterinár nonstop'],['#p~veterinar~kastracia-macky','Kastrácia mačky – ceny'],['#c~psi-salon','Psie salóny']].map(([h,t]) => `<a href="${h}"><span>${t}</span>${I.chev}</a>`).join('')}`; return; }
      const cats = D.cats.filter(c => norm(c.label).includes(q) || norm(c.short).includes(q) || norm(c.one).includes(q));
      const dists = D.districts.filter(x => norm(x.name).includes(q));
      const svcs = Object.entries(D.services).flatMap(([k, list]) => list.map(s => ({k, s}))).filter(({k, s}) => norm(s.label).includes(q) && D.prices.some(p => p.c === s.code && byId[p.b]?.c === k));
      const places = D.biz.filter(b => norm(b.n).includes(q) || norm(b.a).includes(q)).slice(0, 8);
      let html = '';
      if (cats.length) html += `<h3>Služby</h3>` + cats.map(c => `<a href="#c~${c.slug}"><span>${esc(c.label)}</span><span class="muted">${byCat[c.k].length}</span></a>`).join('');
      if (dists.length) html += `<h3>Mestské časti</h3>` + dists.flatMap(x => D.cats.map(c => { const n = D.biz.filter(b => b.d === x.slug && b.c === c.k).length; return n ? `<a href="#c~${c.slug}~${x.slug}"><span>${esc(c.label)} ${esc(x.in)}</span><span class="muted">${n}</span></a>` : ''; })).join('');
      if (svcs.length) html += `<h3>Ceny</h3>` + svcs.map(({k, s}) => `<a href="#p~${catOf(k).slug}~${s.slug}"><span>${esc(s.label)}</span><span class="muted">${esc(catOf(k).short.toLowerCase())}</span></a>`).join('');
      if (places.length) html += `<h3>Miesta</h3>` + places.map(b => `<a href="#b~${b.s}"><span>${esc(b.n)}</span><span class="muted small">${esc(catOf(b.c).short)}</span></a>`).join('');
      out.innerHTML = html || `<p class="muted" style="margin-top:14px">Nič sme nenašli. Skúste názov služby, mestskej časti alebo miesta.</p>`;
    };
    inp.addEventListener('input', run); run();
    out.addEventListener('click', e => { if (e.target.closest('a')) closeSheet(); });
  });
}
function openMenu(){
  openSheet('Menu', `<div>${D.cats.map(c => `<a class="row-link" href="#c~${c.slug}" style="padding:10px 0"><span class="ic" style="width:38px;height:38px">${I[c.k]}</span><span class="tx"><b style="font-size:16px">${esc(c.label)}</b></span><span class="muted">${byCat[c.k].length}</span></a>`).join('')}
    <a class="row-link" href="#p~veterinar" style="padding:12px 0"><span class="tx"><b style="font-size:16px">Ceny v Bratislave</b></span>${I.chev}</a>
    <a class="row-link" href="#m~bratislava" style="padding:12px 0"><span class="tx"><b style="font-size:16px">Všetky služby a mestské časti</b></span>${I.chev}</a>
    <a class="row-link" href="#help" style="padding:12px 0"><span class="tx"><b style="font-size:16px">Ako to funguje (EN)</b></span>${I.chev}</a>
    <a class="row-link" href="#pridat" style="padding:12px 0"><span class="tx"><b style="font-size:16px">Pridať alebo opraviť záznam</b></span>${I.chev}</a>
    <div style="display:flex;gap:8px;margin-top:16px"><span class="fchip" aria-pressed="true" style="background:var(--navy);color:#fff;border-color:var(--navy)">Slovenčina</span><button class="fchip" data-lang>English</button></div></div>`,
    sheet => sheet.addEventListener('click', e => { if (e.target.closest('a')) closeSheet(); }));
}
function openFilters(){
  const [catSlug, sub] = ui.listKey.split('~'); const c = catBySlug(catSlug);
  const dists = D.districts.filter(x => byCat[c.k].some(b => b.d === x.slug));
  const opt = (name, val, cur, label) => `<button class="fchip" data-set="${name}" data-val="${val}" aria-pressed="${String(cur) === String(val)}">${label}</button>`;
  openSheet('Filtre', `
    ${c.k !== 'PET_SHOP' ? `<label class="lbl">Zviera</label><div class="opt-row">${opt('animal','all',ui.animal,'Všetky')}${opt('animal','dog',ui.animal,'Psy')}${opt('animal','cat',ui.animal,'Mačky')}</div>` : ''}
    <label class="lbl">Hodnotenie na Google</label><div class="opt-row">${opt('rating',0,ui.rating,'Všetky')}${opt('rating',4,ui.rating,'4,0 a viac')}${opt('rating',4.5,ui.rating,'4,5 a viac')}</div>
    <label class="lbl" for="f-dist">Mestská časť</label><select class="sel" id="f-dist"><option value="">Celá Bratislava</option>${dists.map(x => `<option value="${x.slug}" ${x.slug === sub ? 'selected' : ''}>${esc(x.name)} (${byCat[c.k].filter(b => b.d === x.slug).length})</option>`).join('')}</select>
    <label class="lbl">Poradie</label><div class="opt-row">${opt('sort','rec',ui.sort,'Odporúčané')}${opt('sort','rating',ui.sort,'Hodnotenie')}${opt('sort','price',ui.sort,'Cena')}</div>
    <button class="btn-dark" data-apply>Zobraziť výsledky</button>`, sheet => {
      sheet.addEventListener('click', e => {
        const b = e.target.closest('[data-set]');
        if (b) { const k = b.dataset.set; ui[k] = k === 'rating' ? Number(b.dataset.val) : b.dataset.val; sheet.querySelectorAll(`[data-set="${k}"]`).forEach(x => x.setAttribute('aria-pressed', x === b)); }
        if (e.target.closest('[data-apply]')) {
          const d = sheet.querySelector('#f-dist').value; const keep = {animal: ui.animal, rating: ui.rating, sort: ui.sort, open: ui.open};
          closeSheet();
          const target = `#c~${c.slug}${d ? '~' + d : ''}`;
          if (location.hash !== target) { ui.listKey = `${c.slug}~${d}`; Object.assign(ui, keep); location.hash = target; } else render();
        }
      });
    });
}
let toastTimer;
function toast(html){
  clearTimeout(toastTimer);
  let t = document.querySelector('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role','status'); document.body.appendChild(t); }
  t.innerHTML = html; t.hidden = false;
  toastTimer = setTimeout(() => { t.hidden = true; }, 7000);
}
function callToast(b){
  toast(`<div class="row"><div>Na webe sa tu vytočí číslo<b class="num">${esc(b.ph)}</b></div><button data-copy="${esc(b.ph)}">Kopírovať</button></div><div class="tiny" style="opacity:.75;margin-top:6px">V prototype nevoláme, aby ste omylom nezavolali ${esc(b.n)}.</div>`);
}

/* ---------- router ---------- */
const app = document.getElementById('app');
let byId = {};
function render(){
  const parts = decodeURIComponent(location.hash.slice(1)).split('~');
  let html;
  switch (parts[0]) {
    case '': html = pageHome(); break;
    case 'c': html = pageList(parts[1], parts[2]); break;
    case 'b': html = pageBiz(parts[1]); break;
    case 'p': html = parts[2] ? pagePrice(parts[1], parts[2]) : pagePrices(parts[1]); break;
    case 'm': html = pageCity(); break;
    case 'help': html = pageHelp(); break;
    case 'pridat': html = pageAdd(); break;
    default: html = page404();
  }
  app.innerHTML = html;
  const hs = app.querySelector('#homeSearch');
  if (hs) hs.addEventListener('submit', e => { e.preventDefault(); const c = hs.querySelector('#hs-cat').value, d = hs.querySelector('#hs-dist').value; const has = !d || byCat[catBySlug(c).k].some(b => b.d === d); location.hash = `#c~${c}${d && has ? '~' + d : ''}`; if (d && !has) setTimeout(() => toast(`V časti ${esc(D.districts.find(x => x.slug === d).name)} zatiaľ nemáme ${esc(catBySlug(c).many)} – ukazujeme celú Bratislavu.`), 50); });
}
function go(){ render(); window.scrollTo(0, 0); }
window.addEventListener('hashchange', go);
document.addEventListener('click', e => {
  const o = e.target.closest('[data-open]'); if (o) { const w = o.dataset.open; (w === 'search' ? openSearch : w === 'menu' ? openMenu : openFilters)(); return; }
  const call = e.target.closest('[data-call]'); if (call) { callToast(byId[call.dataset.call]); return; }
  const cp = e.target.closest('[data-copy]'); if (cp) { const v = cp.dataset.copy; (navigator.clipboard?.writeText(v) || Promise.reject()).then(() => { cp.textContent = 'Skopírované'; }).catch(() => { const r = document.createRange(); const n = cp.previousElementSibling || cp.parentElement; r.selectNodeContents(n); getSelection().removeAllRanges(); getSelection().addRange(r); }); return; }
  const tg = e.target.closest('[data-toggle]'); if (tg) { ui[tg.dataset.toggle] = !ui[tg.dataset.toggle]; render(); return; }
  const ds = e.target.closest('[data-dist]'); if (ds) { ui.distOpen = ui.distOpen === ds.dataset.dist ? '' : ds.dataset.dist; const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  if (e.target.closest('[data-reset]')) { ui.open = false; ui.animal = 'all'; ui.rating = 0; ui.sort = 'rec'; render(); return; }
  if (e.target.closest('[data-lang]')) { toast('Anglická verzia (/en/) bude rovnaká, len s anglickými textami. V prototype je iba slovenčina.'); return; }
});

fetch('data.json').then(r => r.json()).then(data => {
  D = data;
  D.cats.forEach(c => byCat[c.k] = []);
  D.biz.forEach(b => { byCat[b.c].push(b); bySlug[b.s] = b; byId[b.id] = b; });
  D.prices.forEach(p => (pricesBy[p.b] = pricesBy[p.b] || []).push(p));
  go();
}).catch(() => { app.innerHTML = '<div class="wrap" style="padding-block:40px"><p>Údaje sa nepodarilo načítať. Obnovte stránku.</p></div>'; });
})();
</script>
